    <style>
      :root {
        --primary: #155e75;

        --line: rgba(130,190,206,.42);
        --text: #102630;
        --muted: #5f7480;

      * { box-sizing: border-box; }
      html { background: #13221f; }

      .trip { width: min(100vw, 430px); min-height: 100vh; margin: 0 auto; overflow: hidden; background: var(--bg); }
      .hero { position: relative; min-height: 100svh; padding: 28px 20px; display: grid; align-content: space-between; isolation: isolate; }

      .hero::after { content: ""; position: absolute; inset: auto 0 0; height: 40%; z-index: -1; background: linear-gradient(0deg, rgba(255,255,255,.26), transparent); }
      @keyframes drift { from { transform: translate3d(-2%, -1%, 0); } to { transform: translate3d(2%, 1%, 0); } }
      .hero-media { position: absolute; inset: 0; z-index: -3; background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.3)), url("assets/photos/202607101600432390800-003adbdd4a.webp") center / cover; opacity: .32; filter: saturate(.9) contrast(.96); }
      .kicker { margin: 0 0 10px; color: var(--primary); font-size: 12px; font-weight: 780; letter-spacing: 0; }
      h1 { margin: 0; max-width: 9em; color: var(--text); font-size: 42px; font-weight: 800; line-height: 1.06; letter-spacing: 0; text-wrap: balance; }
      .meta { margin: 14px 0 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
      .route-stage, .stat, .story-card, .video-card { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: 0 18px 48px rgba(21,55,50,.13); backdrop-filter: blur(12px) saturate(1.08); }
      .route-stage { padding: 14px; }
      .route-caption { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
      svg { display: block; width: 100%; height: 230px; }
      .route-back { fill: none; stroke: color-mix(in srgb, var(--accent), white 70%); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .route-line { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 9px color-mix(in srgb, var(--accent), transparent 42%)); }
      .metrics, .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .metrics { margin-top: 12px; }
      .metric, .stat { padding: 11px; }
      .metric span, .stat span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 6px; }
      .metric strong { display: block; color: var(--primary); font-size: 15px; line-height: 1.15; }
      .content { padding: 26px 18px 54px; }
      .stat strong { display: block; color: var(--primary); font-size: 19px; line-height: 1.15; }
      .section-head { display: grid; gap: 8px; margin: 42px 0 18px; padding-top: 16px; border-top: 1px solid var(--line); }
      .section-head span { color: var(--accent); font-size: 12px; font-weight: 780; letter-spacing: 0; }
      h2 { margin: 0; color: var(--primary); font-size: 28px; line-height: 1.1; letter-spacing: 0; }
      .photo-story, .video-story { display: grid; gap: 28px; }
      .photo { margin: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: 0 16px 44px rgba(21,55,50,.14); }
      .photo img { display: block; width: 100%; min-height: 300px; object-fit: cover; }
      .photo.feature img { aspect-ratio: 3 / 4; min-height: 440px; }
      .photo.offset { width: calc(100% - 26px); margin-left: 26px; }
      .photo.wide img { aspect-ratio: 16 / 10; min-height: 230px; }
      .story-card { padding: 16px; }
      .story-card .label { color: var(--muted); font-size: 12px; margin-bottom: 13px; }
      .story-card .pairs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .story-card span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 6px; }
      .story-card strong { display: block; color: var(--primary); font-size: 18px; line-height: 1.15; }
      .quote { margin: -6px 16px 2px; color: var(--primary); font-size: 20px; font-weight: 650; line-height: 1.58; text-wrap: balance; }
      .quote::before { content: ""; display: block; width: 34px; height: 2px; margin-bottom: 12px; background: linear-gradient(90deg, var(--accent), transparent); }
      .video-card { padding: 13px; }
      .video-card h3 { margin: 0 0 12px; color: var(--primary); font-size: 21px; letter-spacing: 0; }
      video { display: block; width: 100%; aspect-ratio: 16 / 10; border-radius: 6px; object-fit: cover; background: #152423; }
      .empty { margin: 0; padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); }
      @media (prefers-reduced-motion: reduce) { .hero::before { animation: none; } }

    <script>
      (function () {
        var path = document.getElementById("route-line");
        var back = document.getElementById("route-back");
        fetch("assets/track.json", { cache: "no-store" })
          .then(function (response) { return response.ok ? response.json() : Promise.reject(); })
          .then(function (track) {
            var points = Array.isArray(track.points) ? track.points : [];
            var d = toPath(points);
            if (!d) d = "M 24 206 C 94 166 146 68 296 24";
            path.setAttribute("d", d); back.setAttribute("d", d);
            var length = path.getTotalLength(); path.style.strokeDasharray = length; path.style.strokeDashoffset = length;
            requestAnimationFrame(function () { path.style.transition = "stroke-dashoffset 6s ease-out"; path.style.strokeDashoffset = "0"; });
          })
          .catch(function () { var d = "M 24 206 C 94 166 146 68 296 24"; path.setAttribute("d", d); back.setAttribute("d", d); });
        function toPath(points) {
          if (points.length < 2) return "";
          var sampled = points.length > 720 ? points.filter(function (_, i) { return i % Math.ceil(points.length / 720) === 0; }) : points;
          var lats = sampled.map(function (p) { return Number(p.lat); }); var lngs = sampled.map(function (p) { return Number(p.lng); });
          var minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats), minLng = Math.min.apply(null, lngs), maxLng = Math.max.apply(null, lngs);
          var latSpan = Math.max(maxLat - minLat, 0.000001), lngSpan = Math.max(maxLng - minLng, 0.000001);
          return sampled.map(function (p, i) { var x = 22 + ((Number(p.lng) - minLng) / lngSpan) * 276; var y = 208 - ((Number(p.lat) - minLat) / latSpan) * 186; return (i ? "L " : "M ") + x.toFixed(1) + " " + y.toFixed(1); }).join(" ");
        }
      })();
